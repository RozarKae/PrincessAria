<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 210) scale(1.55, 0.48) translate(-128, -210)" opacity="0.1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(56, 122, 160)">
      <path d="M120 158 Q114.4 180, 133.6 208 Q114 194, 126 178 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M114.4 180 Q124 200 133.6 208"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="162" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(78, 117, 186) translate(0, 0)">
      <rect x="111" y="186" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="184" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="202" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="204" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(-74, 135, 186) translate(0, 0)">
      <rect x="129" y="186" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="184" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="202" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="204" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(-90, 128, 170)">
      <path d="M113 162 L143 162 L152 194 L104 194 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M106 194 L110 198 L116 194 L122 198 L128 194 L134 198 L140 194 L146 198 L150 194 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,162 135,166 135,174 128,178 121,174 121,166"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="170" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M108 190 Q128 195 148 190"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M110 183 Q128 187 146 183"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 164 L128 172 L138 164"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(68, 116, 160)">
        <rect x="112" y="160" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="170" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="180" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(64, 140, 160)">
        <rect x="136" y="160" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="170" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="180" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(-45, 128, 132)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="132" r="22" fill="url(#hairGrad)" />
      <path d="M110 126 Q102 150 112 168 Q120 154 118 140 Z"
            fill="#451a03" />
      <path d="M146 126 Q154 150 144 168 Q136 154 138 140 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="133" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="139" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="139" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 135 Q133 137 131 138" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      
      <ellipse cx="117" cy="130" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="117" cy="130" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="118.2" cy="128.2" r="1.8" fill="#ffffff"/>
      <circle cx="115.8" cy="132" r="0.8" fill="#ffffff"/>
      <path d="M111 123 Q117 121 123 123" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      
      <ellipse cx="139" cy="130" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="139" cy="130" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="140.2" cy="128.2" r="1.8" fill="#ffffff"/>
      <circle cx="137.8" cy="132" r="0.8" fill="#ffffff"/>
      <path d="M133 123 Q139 121 145 123" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      <path d="M124.5 142 Q128 144.5 131.5 142" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 122 Q128 110 146 123 Q136 131 126 127 Q119 129 112 122 Z"
            fill="#92400e" />
      <path d="M136 123 Q144 134 142 144 Q135 136 134 127 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 116 L146 116 L148 112 L140 108 L132 104 L124 108 L118 112 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,108 136,110 136,114 132,116 128,114 128,110"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="112" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
      <g>
        <circle cx="164" cy="118" r="3" fill="#fde047"/>
        <circle cx="96" cy="138" r="2.5" fill="#14b8a6"/>
        <polygon points="163,100 166,105 171,108 166,111 163,116 160,111 155,108 160,105" fill="#ffffff" opacity="0.95"/>
      </g>
    
  </g>
</svg>