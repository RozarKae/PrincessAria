<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 187) scale(1.18, 0.84) translate(-128, -187)" opacity="1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(24, 122, 137)">
      <path d="M120 135 Q101.6 157, 114.4 185 Q114 171, 126 155 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M101.6 157 Q108 177 114.4 185"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="139" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(28, 117, 163) translate(0, 0)">
      <rect x="111" y="163" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="161" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="179" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="181" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(-24, 135, 163) translate(0, -2)">
      <rect x="129" y="163" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="161" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="179" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="181" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(-22, 128, 147)">
      <path d="M113 139 L143 139 L152 171 L104 171 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M106 171 L110 175 L116 171 L122 175 L128 171 L134 175 L140 171 L146 175 L150 171 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,139 135,143 135,151 128,155 121,151 121,143"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="147" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M108 167 Q128 172 148 167"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M110 160 Q128 164 146 160"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 141 L128 149 L138 141"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(42, 116, 137)">
        <rect x="112" y="137" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="147" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="157" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(38, 140, 137)">
        <rect x="136" y="137" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="147" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="157" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(-16, 128, 109)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="109" r="22" fill="url(#hairGrad)" />
      <path d="M110 103 Q102 127 112 145 Q120 131 118 117 Z"
            fill="#451a03" />
      <path d="M146 103 Q154 127 144 145 Q136 131 138 117 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="110" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="116" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="116" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 112 Q133 114 131 115" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      
      <ellipse cx="117" cy="107" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="117" cy="107" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="118.2" cy="105.2" r="1.8" fill="#ffffff"/>
      <circle cx="115.8" cy="109" r="0.8" fill="#ffffff"/>
      <path d="M111 100 Q117 98 123 100" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      
      <ellipse cx="139" cy="107" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="139" cy="107" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="140.2" cy="105.2" r="1.8" fill="#ffffff"/>
      <circle cx="137.8" cy="109" r="0.8" fill="#ffffff"/>
      <path d="M133 100 Q139 98 145 100" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      <path d="M124.5 119 Q128 121.5 131.5 119" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 99 Q128 87 146 100 Q136 108 126 104 Q119 106 112 99 Z"
            fill="#92400e" />
      <path d="M136 100 Q144 111 142 121 Q135 113 134 104 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 93 L146 93 L148 89 L140 85 L132 81 L124 85 L118 89 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,85 136,87 136,91 132,93 128,91 128,87"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="89" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
  </g>
</svg>