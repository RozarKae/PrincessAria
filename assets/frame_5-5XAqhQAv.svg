<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 208) scale(1.5, 0.52) translate(-128, -208)" opacity="0.6">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(52, 122, 158)">
      <path d="M120 156 Q112.8 178, 131.2 206 Q114 192, 126 176 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M112.8 178 Q122 198 131.2 206"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="160" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(72, 117, 184) translate(0, 0)">
      <rect x="111" y="184" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="182" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="200" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="202" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(-68, 135, 184) translate(0, 0)">
      <rect x="129" y="184" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="182" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="200" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="202" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(-85, 128, 168)">
      <path d="M113 160 L143 160 L152 192 L104 192 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M106 192 L110 196 L116 192 L122 196 L128 192 L134 196 L140 192 L146 196 L150 192 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,160 135,164 135,172 128,176 121,172 121,164"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="168" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M108 188 Q128 193 148 188"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M110 181 Q128 185 146 181"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 162 L128 170 L138 162"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(64, 116, 158)">
        <rect x="112" y="158" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="168" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="178" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(60, 140, 158)">
        <rect x="136" y="158" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="168" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="178" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(-42, 128, 130)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="130" r="22" fill="url(#hairGrad)" />
      <path d="M110 124 Q102 148 112 166 Q120 152 118 138 Z"
            fill="#451a03" />
      <path d="M146 124 Q154 148 144 166 Q136 152 138 138 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="131" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="137" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="137" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 133 Q133 135 131 136" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      
      <ellipse cx="117" cy="128" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="117" cy="128" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="118.2" cy="126.2" r="1.8" fill="#ffffff"/>
      <circle cx="115.8" cy="130" r="0.8" fill="#ffffff"/>
      <path d="M111 121 Q117 119 123 121" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      
      <ellipse cx="139" cy="128" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="139" cy="128" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="140.2" cy="126.2" r="1.8" fill="#ffffff"/>
      <circle cx="137.8" cy="130" r="0.8" fill="#ffffff"/>
      <path d="M133 121 Q139 119 145 121" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      <path d="M124.5 140 Q128 142.5 131.5 140" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 120 Q128 108 146 121 Q136 129 126 125 Q119 127 112 120 Z"
            fill="#92400e" />
      <path d="M136 121 Q144 132 142 142 Q135 134 134 125 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 114 L146 114 L148 110 L140 106 L132 102 L124 106 L118 110 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,106 136,108 136,112 132,114 128,112 128,108"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="110" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
      <g>
        <circle cx="164" cy="116" r="3" fill="#fde047"/>
        <circle cx="96" cy="136" r="2.5" fill="#14b8a6"/>
        <polygon points="163,98 166,103 171,106 166,109 163,114 160,109 155,106 160,103" fill="#ffffff" opacity="0.95"/>
      </g>
    
  </g>
</svg>