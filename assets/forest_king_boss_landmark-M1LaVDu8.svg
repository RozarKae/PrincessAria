<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" width="760" height="980">
  <defs>
    <!-- Elder Bark Gradient -->
    <linearGradient id="kingTrunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18110b"/>
      <stop offset="25%" stop-color="#3b2618"/>
      <stop offset="50%" stop-color="#543722"/>
      <stop offset="75%" stop-color="#332014"/>
      <stop offset="100%" stop-color="#120c07"/>
    </linearGradient>

    <!-- Corrupted Purple Magic Veins -->
    <linearGradient id="corruptVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Awakened Radiant Emerald Eyes / Crown -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>

    <filter id="corruptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Distant Brooding Forest Canopy -->
  <ellipse cx="380" cy="180" rx="360" ry="170" fill="#0f172a" opacity="0.85"/>
  <ellipse cx="380" cy="190" rx="320" ry="140" fill="#14532d" opacity="0.75"/>

  <!-- Colossal Tree King Trunk -->
  <path d="M 140 980 Q 240 820 270 650 Q 260 480 240 380 Q 140 320 60 280 L 90 230 Q 220 280 280 340 Q 320 220 350 120 L 410 120 Q 440 220 480 340 Q 540 280 670 230 L 700 280 Q 620 320 520 380 Q 500 480 490 650 Q 520 820 620 980 Z" fill="url(#kingTrunk)" stroke="#0c0704" stroke-width="5"/>

  <!-- Ancient Carved Wooden Face of the Forest King -->
  <!-- Forehead Ridge & Moss Brow -->
  <path d="M 300 400 Q 380 375 460 400" stroke="#18110b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 310 398 Q 380 380 450 398" stroke="#22c55e" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Colossal Sentient Eyes (Corrupted Purple / Emerald Transition) -->
  <ellipse cx="335" cy="445" rx="26" ry="16" fill="#18110b"/>
  <ellipse cx="335" cy="445" rx="18" ry="10" fill="url(#corruptVein)" filter="url(#corruptGlow)"/>
  <circle cx="335" cy="445" r="5" fill="#fef08a"/>

  <ellipse cx="425" cy="445" rx="26" ry="16" fill="#18110b"/>
  <ellipse cx="425" cy="445" rx="18" ry="10" fill="url(#corruptVein)" filter="url(#corruptGlow)"/>
  <circle cx="425" cy="445" r="5" fill="#fef08a"/>

  <!-- Majestic Wooden Nose -->
  <path d="M 380 425 L 370 515 L 390 515 Z" fill="#291a10" stroke="#120c07" stroke-width="3"/>

  <!-- Ancient Mouth / Hollow Portal (revealed upon purification) -->
  <path d="M 320 560 Q 380 540 440 560 Q 380 610 320 560 Z" fill="#0a0604" stroke="#18110b" stroke-width="4"/>

  <!-- Flowing Wooden Beard composed of Buttress Roots -->
  <path d="M 330 580 Q 310 740 280 920" stroke="#291a10" stroke-width="14" fill="none"/>
  <path d="M 360 590 Q 355 760 340 950" stroke="#3b2618" stroke-width="16" fill="none"/>
  <path d="M 400 590 Q 405 760 420 950" stroke="#3b2618" stroke-width="16" fill="none"/>
  <path d="M 430 580 Q 450 740 480 920" stroke="#291a10" stroke-width="14" fill="none"/>

  <!-- Three Corrupted Hive Root Cores (Weakpoints for Boss Encounter) -->
  <!-- Left Root Node Core (x: 230, y: 520) -->
  <g filter="url(#corruptGlow)">
    <circle cx="230" cy="520" r="28" fill="#701a75" stroke="#f0abfc" stroke-width="3"/>
    <circle cx="230" cy="520" r="18" fill="#c026d3"/>
    <circle cx="230" cy="520" r="8" fill="#fdf4ff"/>
    <!-- Radiating Corrupted Root Veins -->
    <path d="M 230 520 Q 270 480 320 460" stroke="#d946ef" stroke-width="4" fill="none"/>
    <path d="M 230 520 Q 210 600 240 680" stroke="#d946ef" stroke-width="4" fill="none"/>
  </g>

  <!-- Right Root Node Core (x: 530, y: 520) -->
  <g filter="url(#corruptGlow)">
    <circle cx="530" cy="520" r="28" fill="#701a75" stroke="#f0abfc" stroke-width="3"/>
    <circle cx="530" cy="520" r="18" fill="#c026d3"/>
    <circle cx="530" cy="520" r="8" fill="#fdf4ff"/>
    <!-- Radiating Corrupted Root Veins -->
    <path d="M 530 520 Q 490 480 440 460" stroke="#d946ef" stroke-width="4" fill="none"/>
    <path d="M 530 520 Q 550 600 520 680" stroke="#d946ef" stroke-width="4" fill="none"/>
  </g>

  <!-- Center Heart Crown Core (x: 380, y: 310) -->
  <g filter="url(#corruptGlow)">
    <circle cx="380" cy="310" r="36" fill="#581c87" stroke="#e879f9" stroke-width="4"/>
    <circle cx="380" cy="310" r="24" fill="#a855f7"/>
    <circle cx="380" cy="310" r="12" fill="#ffffff"/>
    <polygon points="380,285 395,310 380,335 365,310" fill="#f5d0fe"/>
  </g>

  <!-- Ancient Antler-Like Crown Branches -->
  <path d="M 330 180 Q 260 120 220 50 M 260 120 Q 300 70 310 20" stroke="#3b2618" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 430 180 Q 500 120 540 50 M 500 120 Q 460 70 450 20" stroke="#3b2618" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Bioluminescent Leaves and Spores drifting around the crown -->
  <circle cx="220" cy="45" r="6" fill="#86efac" filter="url(#corruptGlow)"/>
  <circle cx="540" cy="45" r="6" fill="#86efac" filter="url(#corruptGlow)"/>
  <circle cx="380" cy="20" r="8" fill="#fde047" filter="url(#corruptGlow)"/>
</svg>
