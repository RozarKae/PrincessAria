<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900">
  <defs>
    <!-- Majestic Ancient Bark Gradient -->
    <linearGradient id="oakTrunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1b10"/>
      <stop offset="25%" stop-color="#4a3322"/>
      <stop offset="55%" stop-color="#6e4d34"/>
      <stop offset="85%" stop-color="#3d281a"/>
      <stop offset="100%" stop-color="#1c1109"/>
    </linearGradient>

    <!-- Whispering Emerald Canopy Gradient -->
    <radialGradient id="canopyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#16a34a"/>
      <stop offset="70%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>

    <!-- Mystical Fungal Shelf Gradient -->
    <linearGradient id="glowFungus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Distant Backdrop Canopy Leaves -->
  <g opacity="0.6">
    <ellipse cx="360" cy="220" rx="310" ry="190" fill="#064e3b"/>
    <ellipse cx="210" cy="260" rx="200" ry="140" fill="#047857"/>
    <ellipse cx="510" cy="260" rx="200" ry="140" fill="#047857"/>
  </g>

  <!-- Colossal Spreading Trunk & Massive Buttress Roots -->
  <path d="M 120 900 Q 230 810 270 660 Q 295 520 280 380 Q 220 310 140 260 L 190 230 Q 300 290 325 360 Q 355 240 375 140 L 420 140 Q 405 250 425 360 Q 460 280 570 220 L 610 250 Q 520 320 480 390 Q 465 520 485 660 Q 520 810 630 900 Z" fill="url(#oakTrunk)" stroke="#140c06" stroke-width="4"/>

  <!-- Ancient Spiraling Bark Ridges & Grooves -->
  <path d="M 290 680 Q 340 560 330 420" stroke="#1c1109" stroke-width="6" fill="none"/>
  <path d="M 330 720 Q 375 580 370 450" stroke="#2a1b10" stroke-width="5" fill="none"/>
  <path d="M 390 740 Q 425 610 415 480" stroke="#1c1109" stroke-width="6" fill="none"/>
  <path d="M 440 700 Q 470 590 460 460" stroke="#24150c" stroke-width="5" fill="none"/>

  <!-- Whispering Face: Subtle Ancient Eyes & Hollow Mouth -->
  <ellipse cx="340" cy="460" rx="14" ry="7" fill="#140c06"/>
  <circle cx="340" cy="460" r="3" fill="#67e8f9" filter="url(#softGlow)"/>

  <ellipse cx="410" cy="460" rx="14" ry="7" fill="#140c06"/>
  <circle cx="410" cy="460" r="3" fill="#67e8f9" filter="url(#softGlow)"/>

  <path d="M 360 495 Q 375 515 390 495" stroke="#140c06" stroke-width="4" fill="none"/>

  <!-- Hollow Sacred Shrine Chamber (Trunk Base) -->
  <ellipse cx="375" cy="670" rx="65" ry="95" fill="#0f0905" stroke="#4a3322" stroke-width="4"/>
  <!-- Shrine Interior Glow -->
  <ellipse cx="375" cy="690" rx="42" ry="55" fill="#0e7490" opacity="0.35" filter="url(#softGlow)"/>
  <!-- Floating Ancient Spirit Orb / Wisp inside hollow -->
  <circle cx="375" cy="660" r="16" fill="#cffafe" filter="url(#softGlow)"/>
  <circle cx="375" cy="660" r="9" fill="#ffffff"/>

  <!-- Bioluminescent Shelf Mushrooms on Trunk -->
  <!-- Shelf 1 (Left Low) -->
  <ellipse cx="250" cy="580" rx="45" ry="14" fill="url(#glowFungus)" filter="url(#softGlow)"/>
  <path d="M 210 580 Q 250 590 290 580" stroke="#cffafe" stroke-width="2" fill="none"/>

  <!-- Shelf 2 (Right Mid) -->
  <ellipse cx="495" cy="520" rx="55" ry="16" fill="url(#glowFungus)" filter="url(#softGlow)"/>
  <path d="M 445 520 Q 495 532 545 520" stroke="#cffafe" stroke-width="2.5" fill="none"/>

  <!-- Shelf 3 (Left High) -->
  <ellipse cx="270" cy="410" rx="38" ry="12" fill="url(#glowFungus)" filter="url(#softGlow)"/>

  <!-- Majestic Main Whispering Foliage Canopy -->
  <ellipse cx="375" cy="180" rx="280" ry="140" fill="url(#canopyGlow)" filter="url(#softGlow)"/>
  <ellipse cx="220" cy="220" rx="180" ry="110" fill="url(#canopyGlow)"/>
  <ellipse cx="530" cy="220" rx="180" ry="110" fill="url(#canopyGlow)"/>

  <!-- Hanging Chimes & Liana Creepers from branches -->
  <path d="M 170 260 Q 185 360 175 460" stroke="#15803d" stroke-width="3" fill="none"/>
  <circle cx="175" cy="465" r="5" fill="#67e8f9"/>

  <path d="M 230 280 Q 245 370 240 450" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <circle cx="240" cy="455" r="4" fill="#a7f3d0"/>

  <path d="M 520 280 Q 510 380 525 470" stroke="#15803d" stroke-width="3" fill="none"/>
  <circle cx="525" cy="475" r="5" fill="#67e8f9"/>

  <path d="M 580 260 Q 570 350 585 430" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <circle cx="585" cy="435" r="4" fill="#a7f3d0"/>
</svg>
