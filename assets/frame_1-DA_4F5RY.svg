<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 196) scale(1.22, 0.75) translate(-128, -196)" opacity="1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(14, 122, 146)">
      <path d="M120 144 Q97.6 166, 108.4 194 Q114 180, 126 164 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M97.6 166 Q103 186 108.4 194"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="148" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(-28, 117, 172) translate(0, 0)">
      <rect x="111" y="172" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="170" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="188" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="190" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(30, 135, 172) translate(0, 0)">
      <rect x="129" y="172" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="170" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="188" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="190" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(12, 128, 156)">
      <path d="M113 148 L143 148 L159 180 L97 180 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M99 180 L103 184 L116 180 L122 184 L128 180 L134 184 L140 180 L153 184 L157 180 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,148 135,152 135,160 128,164 121,160 121,152"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="156" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M102.4 176 Q128 181 153.6 176"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M106.5 169 Q128 173 149.5 169"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 150 L128 158 L138 150"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(-36, 116, 146)">
        <rect x="112" y="146" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="156" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="166" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(-30, 140, 146)">
        <rect x="136" y="146" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="156" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="166" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(0, 128, 118)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="118" r="22" fill="url(#hairGrad)" />
      <path d="M110 112 Q102 136 112 154 Q120 140 118 126 Z"
            fill="#451a03" />
      <path d="M146 112 Q154 136 144 154 Q136 140 138 126 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="119" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="125" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="125" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 121 Q133 123 131 124" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      <path d="M112 117 Q117 112 122 117" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M134 117 Q139 112 144 117" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M124 128 Q128 132 132 128" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 108 Q128 96 146 109 Q136 117 126 113 Q119 115 112 108 Z"
            fill="#92400e" />
      <path d="M136 109 Q144 120 142 130 Q135 122 134 113 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 102 L146 102 L148 98 L140 94 L132 90 L124 94 L118 98 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,94 136,96 136,100 132,102 128,100 128,96"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="98" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
  </g>
</svg>