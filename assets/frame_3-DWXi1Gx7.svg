<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 198) scale(1.35, 0.68) translate(-128, -198)" opacity="1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(42, 122, 148)">
      <path d="M120 146 Q108.8 168, 125.2 196 Q114 182, 126 166 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M108.8 168 Q117 188 125.2 196"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="150" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(52, 117, 174) translate(0, 0)">
      <rect x="111" y="174" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="172" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="190" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="192" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(-48, 135, 174) translate(0, 0)">
      <rect x="129" y="174" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="172" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="190" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="192" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(-55, 128, 158)">
      <path d="M113 150 L143 150 L152 182 L104 182 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M106 182 L110 186 L116 182 L122 186 L128 182 L134 186 L140 182 L146 186 L150 182 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,150 135,154 135,162 128,166 121,162 121,154"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="158" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M108 178 Q128 183 148 178"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M110 171 Q128 175 146 171"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 152 L128 160 L138 152"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(56, 116, 148)">
        <rect x="112" y="148" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="158" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="168" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(52, 140, 148)">
        <rect x="136" y="148" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="158" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="168" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(-32, 128, 120)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="120" r="22" fill="url(#hairGrad)" />
      <path d="M110 114 Q102 138 112 156 Q120 142 118 128 Z"
            fill="#451a03" />
      <path d="M146 114 Q154 138 144 156 Q136 142 138 128 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="121" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="127" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="127" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 123 Q133 125 131 126" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      
      <ellipse cx="117" cy="118" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="117" cy="118" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="118.2" cy="116.2" r="1.8" fill="#ffffff"/>
      <circle cx="115.8" cy="120" r="0.8" fill="#ffffff"/>
      <path d="M111 111 Q117 109 123 111" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      
      <ellipse cx="139" cy="118" rx="4.5" ry="5.5" fill="#0284c7"/>
      <ellipse cx="139" cy="118" rx="3" ry="4" fill="#0d9488"/>
      <circle cx="140.2" cy="116.2" r="1.8" fill="#ffffff"/>
      <circle cx="137.8" cy="120" r="0.8" fill="#ffffff"/>
      <path d="M133 111 Q139 109 145 111" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
    
      <path d="M124.5 130 Q128 132.5 131.5 130" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 110 Q128 98 146 111 Q136 119 126 115 Q119 117 112 110 Z"
            fill="#92400e" />
      <path d="M136 111 Q144 122 142 132 Q135 124 134 115 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 104 L146 104 L148 100 L140 96 L132 92 L124 96 L118 100 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,96 136,98 136,102 132,104 128,102 128,98"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="100" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
  </g>
</svg>