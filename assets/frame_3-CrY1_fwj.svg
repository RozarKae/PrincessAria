<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 176) scale(1, 1.02) translate(-128, -176)" opacity="1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(-8, 122, 126)">
      <path d="M120 124 Q88.8 146, 95.2 174 Q114 160, 126 144 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M88.8 146 Q92 166 95.2 174"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="128" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(8, 117, 152) translate(0, -10)">
      <rect x="111" y="152" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="150" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="168" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="170" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(-6, 135, 152) translate(0, -8)">
      <rect x="129" y="152" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="150" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="168" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="170" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(1, 128, 136)">
      <path d="M113 128 L143 128 L152 160 L104 160 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M106 160 L110 164 L116 160 L122 164 L128 160 L134 164 L140 160 L146 164 L150 160 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,128 135,132 135,140 128,144 121,140 121,132"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="136" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M108 156 Q128 161 148 156"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M110 149 Q128 153 146 149"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 130 L128 138 L138 130"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(12, 116, 126)">
        <rect x="112" y="126" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="136" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="146" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(10, 140, 126)">
        <rect x="136" y="126" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="136" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="146" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(0, 128, 98)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="98" r="22" fill="url(#hairGrad)" />
      <path d="M110 92 Q102 116 112 134 Q120 120 118 106 Z"
            fill="#451a03" />
      <path d="M146 92 Q154 116 144 134 Q136 120 138 106 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="99" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="105" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="105" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 101 Q133 103 131 104" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      <path d="M112 97 Q117 92 122 97" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M134 97 Q139 92 144 97" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M124 108 Q128 112 132 108" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 88 Q128 76 146 89 Q136 97 126 93 Q119 95 112 88 Z"
            fill="#92400e" />
      <path d="M136 89 Q144 100 142 110 Q135 102 134 93 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 82 L146 82 L148 78 L140 74 L132 70 L124 74 L118 78 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,74 136,76 136,80 132,82 128,80 128,76"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="78" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
  </g>
</svg>