<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 600" width="2048" height="600">
  <defs>
    <!-- Deep Atmospheric Woodland Gradient (Distant Silhouette) -->
    <linearGradient id="bgCanopyDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#022c22" />
      <stop offset="85%" stop-color="#011913" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Mid-Distant Forest Ridge Gradient -->
    <linearGradient id="bgCanopyMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="40%" stop-color="#0f3f22" />
      <stop offset="80%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#021a0d" />
    </linearGradient>

    <!-- Sunlit Foliage Crown Rims -->
    <linearGradient id="bgCanopyRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#15803d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#052e16" stop-opacity="0" />
    </linearGradient>

    <!-- Atmospheric Valley Mist Layer -->
    <linearGradient id="bgCanopyMist" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. FAR FOREST SILHOUETTE (Distant Scalloped Crowns & Spires) -->
  <!-- ======================================================== -->
  <g fill="url(#bgCanopyDeep)">
    <path d="M-50 600 L-50 380
             Q20 320 80 340 Q130 290 190 310 Q240 260 310 280 Q370 230 450 250
             Q520 200 600 230 Q680 180 770 210 Q850 170 940 200 Q1020 160 1120 190
             Q1200 150 1300 180 Q1390 160 1480 200 Q1560 180 1650 220 Q1740 190 1830 230
             Q1920 220 2000 270 Q2050 250 2100 300
             L2100 600 Z" />
  </g>

  <!-- Soft Mist Infiltration between Far and Mid Forest -->
  <rect x="0" y="320" width="2048" height="180" fill="url(#bgCanopyMist)" opacity="0.6" />

  <!-- ======================================================== -->
  <!-- 2. MID-DISTANT FOREST RIDGE (Layered Ancient Woodland) -->
  <!-- ======================================================== -->
  <g fill="url(#bgCanopyMid)">
    <!-- Scalloped, natural undulating forest crowns -->
    <path d="M-50 600 L-50 430
             Q30 380 90 410 Q140 360 210 375 Q280 340 360 365 Q420 320 500 340
             Q570 300 660 320 Q740 285 830 310 Q910 270 1000 295 Q1080 260 1180 290
             Q1260 250 1360 280 Q1440 260 1530 290 Q1620 275 1710 310 Q1800 290 1890 330
             Q1970 320 2050 370 Q2080 360 2100 400
             L2100 600 Z" />

    <!-- Occasional Ancient Tree Trunks visible in mid-canopy -->
    <g fill="#1c0b02" opacity="0.65">
      <rect x="220" y="440" width="22" height="160" />
      <rect x="670" y="420" width="26" height="180" />
      <rect x="1220" y="410" width="28" height="190" />
      <rect x="1740" y="430" width="24" height="170" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. SUNLIT CANOPY RIM HIGHLIGHTS (Dappled Morning Light) -->
  <!-- ======================================================== -->
  <g fill="url(#bgCanopyRim)">
    <path d="M80 410 Q140 360 210 375 Q250 355 280 370 Q210 385 140 395 Q100 420 80 410 Z" />
    <path d="M350 365 Q420 320 500 340 Q540 325 570 335 Q500 355 430 360 Q380 380 350 365 Z" />
    <path d="M650 320 Q740 285 830 310 Q870 290 910 305 Q830 325 750 335 Q690 345 650 320 Z" />
    <path d="M990 295 Q1080 260 1180 290 Q1220 270 1260 285 Q1180 310 1100 315 Q1040 325 990 295 Z" />
    <path d="M1350 280 Q1440 260 1530 290 Q1570 275 1610 290 Q1530 310 1450 315 Q1390 320 1350 280 Z" />
    <path d="M1700 310 Q1800 290 1890 330 Q1930 320 1970 335 Q1890 355 1810 355 Q1750 350 1700 310 Z" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. ATMOSPHERIC FOREST FLOOR MIST (Soft Horizon Blanket) -->
  <!-- ======================================================== -->
  <rect x="0" y="470" width="2048" height="130" fill="url(#bgCanopyMist)" />
</svg>
