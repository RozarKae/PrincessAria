<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <defs>
    <!-- Cap Surface Gradient -->
    <linearGradient id="bracketCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Bioluminescent Underside Glow -->
    <radialGradient id="bracketGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Large Lower Bracket Fungi -->
  <g id="bracket_lower">
    <ellipse cx="42" cy="46" rx="34" ry="14" fill="url(#bracketGlow)" />
    <path d="M12 40 Q40 22 72 40 Q62 52 42 52 Q22 52 12 40 Z" fill="url(#bracketCap)" stroke="#451a03" stroke-width="1.8" />
    <!-- Concentric Growth Rings on Cap -->
    <path d="M22 38 Q40 28 62 38" stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.8" />
    <path d="M30 34 Q40 28 52 34" stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.8" />
  </g>

  <!-- Small Upper Bracket Fungi -->
  <g id="bracket_upper">
    <ellipse cx="32" cy="24" rx="24" ry="10" fill="url(#bracketGlow)" />
    <path d="M10 20 Q32 8 54 20 Q46 29 32 29 Q18 29 10 20 Z" fill="url(#bracketCap)" stroke="#451a03" stroke-width="1.5" />
    <path d="M18 18 Q32 12 46 18" stroke="#fde047" stroke-width="1.2" fill="none" opacity="0.8" />
  </g>
</svg>
