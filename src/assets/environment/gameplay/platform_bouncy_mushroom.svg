<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120">
  <defs>
    <!-- Cap bioluminescent gradient -->
    <linearGradient id="shroomCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <!-- Stem fibrous gradient -->
    <linearGradient id="shroomStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Gills under-cap glow -->
    <linearGradient id="shroomGills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <!-- Spore glow filter -->
    <filter id="sporeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Thick Elastic Stipe / Stem -->
  <path d="M 85 65 Q 92 95 75 118 L 165 118 Q 148 95 155 65 Z" fill="url(#shroomStem)"/>
  <!-- Stem ring / Annulus -->
  <ellipse cx="120" cy="72" rx="38" ry="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="120" cy="75" rx="36" ry="6" fill="#1e293b"/>

  <!-- Bioluminescent Gills Layer -->
  <ellipse cx="120" cy="62" rx="105" ry="24" fill="url(#shroomGills)"/>
  <!-- Gill radiating striations -->
  <path d="M 120 62 L 35 60 M 120 62 L 50 68 M 120 62 L 70 74 M 120 62 L 95 78 M 120 62 L 145 78 M 120 62 L 170 74 M 120 62 L 190 68 M 120 62 L 205 60" stroke="#bae6fd" stroke-width="2.5" opacity="0.85"/>

  <!-- Main Elastic Dome Cap -->
  <path d="M 15 60 C 15 15, 60 5, 120 5 C 180 5, 225 15, 225 60 C 225 68, 195 72, 120 72 C 45 72, 15 68, 15 60 Z" fill="url(#shroomCap)" stroke="#38bdf8" stroke-width="3"/>

  <!-- Bioluminescent Spore Spots (Luminous Cyan & White) -->
  <g filter="url(#sporeGlow)">
    <circle cx="120" cy="22" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="120" cy="22" r="9" fill="#7dd3fc"/>

    <circle cx="70" cy="34" r="11" fill="#ffffff" opacity="0.85"/>
    <circle cx="70" cy="34" r="7" fill="#7dd3fc"/>

    <circle cx="170" cy="34" r="11" fill="#ffffff" opacity="0.85"/>
    <circle cx="170" cy="34" r="7" fill="#7dd3fc"/>

    <circle cx="40" cy="48" r="8" fill="#bae6fd" opacity="0.8"/>
    <circle cx="200" cy="48" r="8" fill="#bae6fd" opacity="0.8"/>
    <circle cx="100" cy="42" r="6" fill="#ffffff" opacity="0.75"/>
    <circle cx="140" cy="42" r="6" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Rim Highlight for maximum platform surface readability -->
  <path d="M 30 58 Q 120 66 210 58" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7"/>
</svg>
