<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460">
  <defs>
    <linearGradient id="vaultObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09071a" />
    </linearGradient>

    <linearGradient id="vaultGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <radialGradient id="batKeepsakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Secret Aura -->
  <circle cx="240" cy="230" r="190" fill="#f59e0b" opacity="0.15" />

  <!-- Pavilion Vault Dome (Hexagonal Sanctuary Roof) -->
  <polygon points="240,40 370,110 370,160 240,130 110,160 110,110" fill="url(#vaultObsidian)" stroke="url(#vaultGold)" stroke-width="2.5" />
  <!-- Spire Finial -->
  <polygon points="240,20 248,40 232,40" fill="url(#vaultGold)" />

  <!-- Flanking Carved Pillars -->
  <polygon points="120,160 150,145 180,160 180,420 150,435 120,420" fill="url(#vaultObsidian)" stroke="#3f3261" stroke-width="2" />
  <polygon points="300,160 330,145 360,160 360,420 330,435 300,420" fill="url(#vaultObsidian)" stroke="#3f3261" stroke-width="2" />

  <!-- Gold Runic Tracery on Pillars -->
  <path d="M150,170 L150,410 M330,170 L330,410" stroke="url(#vaultGold)" stroke-width="2" stroke-dasharray="6 4" opacity="0.85" />

  <!-- Pedestal Altar Base -->
  <polygon points="150,380 330,380 350,430 130,430" fill="url(#vaultObsidian)" stroke="url(#vaultGold)" stroke-width="3" />
  <rect x="180" y="340" width="120" height="40" fill="#181428" stroke="url(#vaultGold)" stroke-width="2" />

  <!-- The Keepsake: Enchanted Bat Emblem of Khan Floating in Radiant Cyan & Gold Aura -->
  <circle cx="240" cy="270" r="50" fill="url(#batKeepsakeGlow)" />

  <!-- Batboy Keepsake Emblem -->
  <!-- Spread Bat Wings -->
  <path d="M240,265 C220,240 185,250 170,270 C190,275 210,270 225,280 C235,288 240,295 240,295 C240,295 245,288 255,280 C270,270 290,275 310,270 C295,250 260,240 240,265 Z" fill="#0f172a" stroke="url(#vaultGold)" stroke-width="2.5" />
  <!-- Center Cyan Bat Gem -->
  <polygon points="240,260 248,272 240,284 232,272" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

  <!-- Floating Golden Relic Shards -->
  <polygon points="200,210 206,218 200,226 194,218" fill="url(#vaultGold)" />
  <polygon points="280,210 286,218 280,226 274,218" fill="url(#vaultGold)" />
  <polygon points="240,180 246,188 240,196 234,188" fill="url(#vaultGold)" />

  <!-- Sparkles around the secret chamber -->
  <circle cx="190" cy="260" r="3" fill="#38bdf8" />
  <circle cx="290" cy="260" r="3" fill="#38bdf8" />
  <circle cx="240" cy="235" r="3.5" fill="#fef08a" />
</svg>
