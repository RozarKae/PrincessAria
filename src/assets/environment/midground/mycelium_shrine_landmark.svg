<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 880" width="680" height="880">
  <defs>
    <!-- Giant Cap Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="altarStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="myceliumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Distant Background Spore Aura -->
  <circle cx="340" cy="440" r="300" fill="#0284c7" opacity="0.12" filter="url(#myceliumGlow)"/>

  <!-- Left Secondary Mushroom (Neon Magenta) -->
  <path d="M 120 420 Q 150 640 140 840 L 190 840 Q 185 640 170 420 Z" fill="#475569"/>
  <!-- Cap -->
  <path d="M 40 430 C 40 280, 240 280, 240 430 C 240 460, 40 460, 40 430 Z" fill="url(#neonPink)" filter="url(#myceliumGlow)"/>
  <ellipse cx="140" cy="435" rx="90" ry="18" fill="#be123c"/>
  <circle cx="110" cy="340" r="12" fill="#ffffff" opacity="0.85"/>
  <circle cx="165" cy="360" r="10" fill="#ffffff" opacity="0.85"/>

  <!-- Right Secondary Mushroom (Neon Purple) -->
  <path d="M 490 380 Q 480 620 460 840 L 515 840 Q 525 620 545 380 Z" fill="#334155"/>
  <!-- Cap -->
  <path d="M 420 390 C 420 230, 630 230, 630 390 C 630 420, 420 420, 420 390 Z" fill="url(#neonPurple)" filter="url(#myceliumGlow)"/>
  <ellipse cx="525" cy="395" rx="95" ry="18" fill="#7e22ce"/>
  <circle cx="490" cy="290" r="14" fill="#ffffff" opacity="0.85"/>
  <circle cx="560" cy="310" r="10" fill="#ffffff" opacity="0.85"/>

  <!-- Monumental Center Emperor Mushroom (Luminous Cyan) -->
  <path d="M 285 240 Q 305 560 270 850 L 410 850 Q 375 560 395 240 Z" fill="#1e293b"/>
  <!-- Gills Understructure -->
  <ellipse cx="340" cy="250" rx="200" ry="45" fill="#0284c7" filter="url(#myceliumGlow)"/>
  <!-- Emperor Cap -->
  <path d="M 120 240 C 120 40, 560 40, 560 240 C 560 280, 120 280, 120 240 Z" fill="url(#neonCyan)" stroke="#7dd3fc" stroke-width="4" filter="url(#myceliumGlow)"/>
  <!-- Luminous Bioluminescent Orbs on Emperor Cap -->
  <circle cx="340" cy="110" r="24" fill="#ffffff" opacity="0.95"/>
  <circle cx="340" cy="110" r="14" fill="#7dd3fc"/>

  <circle cx="230" cy="150" r="18" fill="#ffffff" opacity="0.9"/>
  <circle cx="230" cy="150" r="10" fill="#7dd3fc"/>

  <circle cx="450" cy="150" r="18" fill="#ffffff" opacity="0.9"/>
  <circle cx="450" cy="150" r="10" fill="#7dd3fc"/>

  <!-- Ancient Druidic Mycelium Altar (Center Base) -->
  <polygon points="210,870 250,750 430,750 470,870" fill="url(#altarStone)" stroke="#475569" stroke-width="3"/>
  <polygon points="230,750 250,710 430,710 450,750" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- Glowing Ancient Rune Carvings on Altar Slab -->
  <path d="M 290 790 L 340 765 L 390 790 L 370 835 L 310 835 Z" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#myceliumGlow)"/>
  <circle cx="340" cy="800" r="6" fill="#38bdf8" filter="url(#myceliumGlow)"/>

  <!-- Cascading Glowing Spore Trails Falling from Caps -->
  <g fill="#bae6fd" opacity="0.85">
    <circle cx="200" cy="300" r="4"/>
    <circle cx="220" cy="360" r="3"/>
    <circle cx="210" cy="420" r="4"/>
    <circle cx="280" cy="320" r="3.5"/>
    <circle cx="300" cy="400" r="4"/>
    <circle cx="370" cy="340" r="4"/>
    <circle cx="400" cy="420" r="3"/>
    <circle cx="480" cy="310" r="4"/>
    <circle cx="460" cy="380" r="3.5"/>
  </g>
</svg>
