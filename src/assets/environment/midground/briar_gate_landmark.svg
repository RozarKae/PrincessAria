<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 840" width="640" height="840">
  <defs>
    <linearGradient id="briarPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1124"/>
      <stop offset="40%" stop-color="#3b1d4a"/>
      <stop offset="70%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1124"/>
    </linearGradient>
    <linearGradient id="thornCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Twisted Briar Colonnade Pillar -->
  <path d="M 120 840 Q 150 560 130 320 Q 170 200 240 160 L 260 210 Q 195 240 180 340 Q 200 580 180 840 Z" fill="url(#briarPillar)" stroke="#0f0714" stroke-width="4"/>

  <!-- Right Twisted Briar Colonnade Pillar -->
  <path d="M 520 840 Q 490 560 510 320 Q 470 200 400 160 L 380 210 Q 445 240 460 340 Q 440 580 460 840 Z" fill="url(#briarPillar)" stroke="#0f0714" stroke-width="4"/>

  <!-- Intertwining Overhead Bramble Arch Vault -->
  <path d="M 140 320 Q 320 80 500 320 Q 450 360 320 180 Q 190 360 140 320 Z" fill="url(#briarPillar)" stroke="#0f0714" stroke-width="4"/>

  <!-- Giant Wicked Crimson Thorns on Arch -->
  <!-- Left Thorns -->
  <path d="M 130 520 Q 70 500 40 460 Q 90 490 140 495 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M 140 380 Q 80 340 45 290 Q 100 340 150 355 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M 160 260 Q 110 200 80 140 Q 130 205 180 235 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Arch Apex Crown Thorns -->
  <path d="M 280 140 Q 300 60 320 20 Q 340 60 360 140 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="2" filter="url(#crimsonGlow)"/>
  <path d="M 230 170 Q 220 90 200 40 Q 240 100 260 160 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M 410 170 Q 420 90 440 40 Q 400 100 380 160 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Right Thorns -->
  <path d="M 510 520 Q 570 500 600 460 Q 550 490 500 495 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M 500 380 Q 560 340 595 290 Q 540 340 490 355 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M 480 260 Q 530 200 560 140 Q 510 205 460 235 Z" fill="url(#thornCrimson)" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Central Glowing Briar Eye / Keystone -->
  <circle cx="320" cy="180" r="30" fill="#2e1065" stroke="#ef4444" stroke-width="3"/>
  <polygon points="320,158 335,178 320,198 305,178" fill="#ef4444" filter="url(#crimsonGlow)"/>
  <circle cx="320" cy="178" r="5" fill="#fef08a"/>

  <!-- Carved Sentinel Totem Masks on Gate Posts -->
  <ellipse cx="160" cy="620" rx="16" ry="24" fill="#0f0714"/>
  <circle cx="155" cy="615" r="3" fill="#ef4444"/>
  <circle cx="165" cy="615" r="3" fill="#ef4444"/>

  <ellipse cx="480" cy="620" rx="16" ry="24" fill="#0f0714"/>
  <circle cx="475" cy="615" r="3" fill="#ef4444"/>
  <circle cx="485" cy="615" r="3" fill="#ef4444"/>
</svg>
