<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g id="aria_back">
    
      <!-- BACK VIEW BODY &amp; COSTUME -->
      <!-- Explorer Knee-High Boots -->
      <rect x="110" y="188" width="14" height="28" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.5" />
      <rect x="132" y="188" width="14" height="28" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.5" />
      <!-- Gold Buckles &amp; Emerald Stitching on Back -->
      <rect x="110" y="194" width="14" height="4" fill="#fbbf24" />
      <rect x="132" y="194" width="14" height="4" fill="#fbbf24" />

      <!-- Skirt Back (Honey-Gold Layered Petal Hem) -->
      <path d="M104 142 L152 142 L160 184 L96 184 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />
      <path d="M98 178 Q128 184 158 178"
            stroke="#fde047" stroke-width="2.5" fill="none" />

      <!-- WING-CUT ROYAL HONEY SILK CAPELET (Drapes over back in graceful wing contours) -->
      <path d="M112 115 Q88 155 100 198 Q128 178 156 198 Q168 155 144 115 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.5" />

      <!-- Honeycomb Embroidery on Capelet Hem -->
      <path d="M102 192 Q128 176 154 192"
            stroke="#fde047" stroke-width="2" fill="none" />
      <polygon points="128,170 134,174 134,182 128,186 122,182 122,174"
               fill="#18181b" stroke="#fbbf24" stroke-width="1" />
      <circle cx="128" cy="178" r="2" fill="url(#emeraldGrad)" />

      <!-- Shoulders &amp; Upper Capelet -->
      <path d="M106 116 L150 116 L154 134 L102 134 Z"
            fill="#18181b" stroke="#d97706" stroke-width="1" />
    
    
      <!-- Back View Head &amp; Adventurer Ponytail/Braid -->
      <g>
        <circle cx="128" cy="86" r="22" fill="url(#hairGrad)" />
        <!-- Adventurer Braid / Ponytail falling down back -->
        <path d="M120 82 Q114 111 122 134 Q128 116 134 134 Q142 111 136 82 Z"
              fill="#451a03" stroke="#92400e" stroke-width="1.5" />
        <!-- Braid Golden Tie Ribbon -->
        <rect x="121" y="128" width="14" height="4" rx="2" fill="#fbbf24" />
        <!-- Honeycomb Tiara Back Band -->
        <path d="M112 74 Q128 70 144 74"
              stroke="#fbbf24" stroke-width="2.5" fill="none" />
      </g>
    
  </g>
</svg>