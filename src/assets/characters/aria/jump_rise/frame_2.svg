<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 175) scale(0.96, 1.06) translate(-128, -175)" opacity="1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(-14, 122, 125)">
      <path d="M120 123 Q86.4 145, 91.6 173 Q114 159, 126 143 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M86.4 145 Q89 165 91.6 173"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="127" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(10, 117, 151) translate(0, -12)">
      <rect x="111" y="151" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="149" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="167" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="169" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(-8, 135, 151) translate(0, -10)">
      <rect x="129" y="151" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="149" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="167" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="169" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(0, 128, 135)">
      <path d="M113 127 L143 127 L152 159 L104 159 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M106 159 L110 163 L116 159 L122 163 L128 159 L134 163 L140 159 L146 163 L150 159 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,127 135,131 135,139 128,143 121,139 121,131"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="135" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M108 155 Q128 160 148 155"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M110 148 Q128 152 146 148"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 129 L128 137 L138 129"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(18, 116, 125)">
        <rect x="112" y="125" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="135" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="145" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(16, 140, 125)">
        <rect x="136" y="125" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="135" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="145" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(0, 128, 97)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="97" r="22" fill="url(#hairGrad)" />
      <path d="M110 91 Q102 115 112 133 Q120 119 118 105 Z"
            fill="#451a03" />
      <path d="M146 91 Q154 115 144 133 Q136 119 138 105 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="98" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="104" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="104" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 100 Q133 102 131 103" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      <path d="M112 96 Q117 91 122 96" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M134 96 Q139 91 144 96" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M124 107 Q128 111 132 107" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 87 Q128 75 146 88 Q136 96 126 92 Q119 94 112 87 Z"
            fill="#92400e" />
      <path d="M136 88 Q144 99 142 109 Q135 101 134 92 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 81 L146 81 L148 77 L140 73 L132 69 L124 73 L118 77 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,73 136,75 136,79 132,81 128,79 128,75"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="77" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
  </g>
</svg>