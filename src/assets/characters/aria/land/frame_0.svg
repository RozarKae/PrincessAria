<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
    <defs>
      <!-- Royal Honey Dress Gradient -->
      <linearGradient id="ariaDressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="35%" stop-color="#18181b" />
        <stop offset="70%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#09090b" />
      </linearGradient>

      <!-- Wing-Cut Capelet Gradient (Warm Honey to Rich Amber) -->
      <linearGradient id="ariaCapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Emerald Jewel Gradient -->
      <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#14b8a6" />
        <stop offset="60%" stop-color="#0d9488" />
        <stop offset="100%" stop-color="#047857" />
      </radialGradient>

      <!-- Ivory Ruffle Gradient -->
      <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fefce8" />
        <stop offset="100%" stop-color="#fffbeb" />
      </linearGradient>

      <!-- Hair Gradient -->
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="60%" stop-color="#92400e" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
    </defs>
  
  <g transform="translate(128, 192) scale(1.25, 0.78) translate(-128, -192)" opacity="1">
    

    <!-- 1. WING-CUT ROYAL CAPELET (FLOWING FABRIC, NO PHYSICAL INSECT WINGS) -->
    <g transform="rotate(8, 122, 142)">
      <path d="M120 140 Q95.2 162, 104.8 190 Q114 176, 126 160 Z"
            fill="url(#ariaCapeGrad)" stroke="#d97706" stroke-width="1.2" />
      <path d="M95.2 162 Q100 182 104.8 190"
            stroke="#fde047" stroke-width="2" fill="none" />
      <!-- Subtle Emerald Brooch on Capelet -->
      <circle cx="120" cy="144" r="2" fill="url(#emeraldGrad)" />
    </g>

    <!-- 2. EXPLORER KNEE-HIGH BOOTS &amp; LEGS -->
    <!-- Left Leg / Boot -->
    <g transform="rotate(-18, 117, 168) translate(0, 0)">
      <rect x="111" y="168" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="111" y="166" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="110" y="184" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="111" y="186" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- Right Leg / Boot -->
    <g transform="rotate(18, 135, 168) translate(0, 0)">
      <rect x="129" y="168" width="12" height="18" rx="3" fill="#18181b" stroke="#09090b" stroke-width="1" />
      <rect x="129" y="166" width="12" height="4" rx="1.5" fill="#fbbf24" />
      <rect x="128" y="184" width="15" height="6" rx="2" fill="#09090b" />
      <rect x="129" y="186" width="13" height="2" fill="#fbbf24" />
    </g>

    <!-- 3. BEE-INSPIRED LAYERED PETAL SKIRT &amp; PEPLUM -->
    <g transform="rotate(2, 128, 152)">
      <path d="M113 144 L143 144 L158 176 L98 176 Z"
            fill="url(#ariaDressGrad)" stroke="#09090b" stroke-width="1.5" />

      <!-- Ivory Ruffle Pleats -->
      <path d="M100 176 L104 180 L116 176 L122 180 L128 176 L134 180 L140 176 L152 180 L156 176 Z"
            fill="url(#ivoryGrad)" stroke="#d97706" stroke-width="0.8" />

      <!-- Honeycomb Royal Belt Emblem with Emerald Accent -->
      <polygon points="128,144 135,148 135,156 128,160 121,156 121,148"
               fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <circle cx="128" cy="152" r="2.4" fill="url(#emeraldGrad)" />

      <!-- Skirt Golden Honeycomb Trims -->
      <path d="M103.2 172 Q128 177 152.8 172"
            stroke="#fde047" stroke-width="2.5" fill="none" />
      <path d="M107 165 Q128 169 149 165"
            stroke="#f59e0b" stroke-width="2" fill="none" />

      <!-- Doublet Bodice Chevrons -->
      <path d="M118 146 L128 154 L138 146"
            stroke="#fde047" stroke-width="2" fill="none" />

      <!-- Left Arm &amp; Bracer -->
      <g transform="rotate(-24, 116, 142)">
        <rect x="112" y="142" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="112" y="152" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="116" cy="162" r="4" fill="#fed7aa" />
      </g>

      <!-- Right Arm &amp; Bracer -->
      <g transform="rotate(-20, 140, 142)">
        <rect x="136" y="142" width="8" height="18" rx="4" fill="#fbbf24" />
        <rect x="136" y="152" width="8" height="6" rx="2" fill="#18181b" />
        <circle cx="140" cy="162" r="4" fill="#fed7aa" />
      </g>
    </g>

    <!-- 4. HEAD, TIARA &amp; HAIR -->
    <g transform="rotate(0, 128, 114)">
      
    <!-- Head Base &amp; Flowing Chestnut Hair -->
    <g>
      <!-- Back Hair Volume -->
      <circle cx="128" cy="114" r="22" fill="url(#hairGrad)" />
      <path d="M110 108 Q102 132 112 150 Q120 136 118 122 Z"
            fill="#451a03" />
      <path d="M146 108 Q154 132 144 150 Q136 136 138 122 Z"
            fill="#451a03" />

      <!-- Face -->
      <circle cx="132" cy="115" r="17" fill="#fed7aa" />

      <!-- Cheeks Blush -->
      <ellipse cx="124" cy="121" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />
      <ellipse cx="140" cy="121" rx="4" ry="2.2" fill="#f43f5e" opacity="0.35" />

      <!-- Nose -->
      <path d="M132 117 Q133 119 131 120" stroke="#fdba74" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Eyes &amp; Mouth -->
      <path d="M112 113 Q117 108 122 113" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M134 113 Q139 108 144 113" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M124 124 Q128 128 132 124" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Front Hair Bangs with Amber Highlights -->
      <path d="M112 104 Q128 92 146 105 Q136 113 126 109 Q119 111 112 104 Z"
            fill="#92400e" />
      <path d="M136 105 Q144 116 142 126 Q135 118 134 109 Z"
            fill="#78350f" />

      <!-- HONEYCOMB TIARA WITH EMERALD DROPLET JEWEL (NO insect wings) -->
      <path d="M120 98 L146 98 L148 94 L140 90 L132 86 L124 90 L118 94 Z"
            fill="#fbbf24" stroke="#d97706" stroke-width="1.2" />

      <!-- Hexagonal Honeycomb Inset on Tiara -->
      <polygon points="132,90 136,92 136,96 132,98 128,96 128,92"
               fill="#18181b" stroke="#fde047" stroke-width="0.8" />

      <!-- Center Emerald Droplet Gem -->
      <circle cx="132" cy="94" r="2.8" fill="url(#emeraldGrad)" stroke="#fde047" stroke-width="0.8" />
    </g>
  
    </g>

    
  </g>
</svg>