<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Radiant Celestial Starlight Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Stardust Prismatic Ring -->
    <linearGradient id="crystalFacetH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="crystalFacetV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="celestialBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="32" cy="32" r="30" fill="url(#starGlow)" />

  <!-- Outer Secondary 4-Point Prismatic Diamond (Gold/Cyan) -->
  <g transform="rotate(45 32 32)">
    <path d="M 32 10 L 36 28 L 54 32 L 36 36 L 32 54 L 28 36 L 10 32 L 28 28 Z" 
          fill="#fbbf24" opacity="0.85" filter="url(#celestialBloom)" />
  </g>

  <!-- Primary 4-Point Celestial Diamond Beam -->
  <path d="M 32 2 L 38 26 L 62 32 L 38 38 L 32 62 L 26 38 L 2 32 L 26 26 Z" 
        fill="url(#crystalFacetH)" filter="url(#celestialBloom)" />

  <!-- Vertical Inner Core Needle -->
  <path d="M 32 6 L 35 28 L 48 32 L 35 36 L 32 58 L 29 36 L 16 32 L 29 28 Z" 
        fill="url(#crystalFacetV)" />

  <!-- Radiant Diamond Center Core -->
  <polygon points="32,20 38,32 32,44 26,32" fill="#ffffff" />
  <circle cx="32" cy="32" r="5" fill="#ffffff" />

  <!-- Trailing Stardust Sparkles -->
  <circle cx="16" cy="18" r="2" fill="#fef08a" opacity="0.8" />
  <circle cx="48" cy="18" r="1.5" fill="#67e8f9" opacity="0.9" />
  <circle cx="18" cy="46" r="2" fill="#67e8f9" opacity="0.8" />
  <circle cx="46" cy="46" r="1.8" fill="#fef08a" opacity="0.85" />
</svg>
