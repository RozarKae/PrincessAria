<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <!-- Queen Carapace Dark Chocolate / Obsidian -->
    <linearGradient id="queenCarapace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1608" />
      <stop offset="40%" stop-color="#180d04" />
      <stop offset="85%" stop-color="#090502" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Royal Burgundy Velvet Drapery Gradient -->
    <linearGradient id="royalBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="45%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Corrupted Royal Amber Glowing Honey Rings -->
    <linearGradient id="queenAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Majestic Gossamer Wings -->
    <linearGradient id="queenWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.55)" />
      <stop offset="40%" stop-color="rgba(245, 158, 11, 0.35)" />
      <stop offset="80%" stop-color="rgba(127, 29, 29, 0.25)" />
      <stop offset="100%" stop-color="rgba(24, 13, 4, 0.45)" />
    </linearGradient>

    <!-- Ruby Compound Eye Glow -->
    <radialGradient id="rubyEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f87171" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <filter id="queenAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ENORMOUS GOSSAMER WINGS (Background) -->
  <g fill="url(#queenWing)" stroke="#fef08a" stroke-width="1.8" filter="url(#queenAura)">
    <!-- Upper Left Main Wing -->
    <path d="M 280 180 C 180 50, 40 40, 10 110 C -10 170, 70 240, 260 210 Z" />
    <!-- Lower Left Secondary Wing -->
    <path d="M 270 210 C 150 210, 40 250, 30 320 C 40 370, 130 360, 260 250 Z" />
    <!-- Upper Right Main Wing -->
    <path d="M 320 180 C 420 50, 560 40, 590 110 C 610 170, 530 240, 340 210 Z" />
    <!-- Lower Right Secondary Wing -->
    <path d="M 330 210 C 450 210, 560 250, 570 320 C 560 370, 470 360, 340 250 Z" />
  </g>

  <!-- Wing Vein Structure -->
  <g stroke="#d97706" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 280 180 Q 140 100 20 110" />
    <path d="M 200 130 Q 120 160 60 180" />
    <path d="M 320 180 Q 460 100 580 110" />
    <path d="M 400 130 Q 480 160 540 180" />
  </g>

  <!-- Royal Armored Insect Legs -->
  <g stroke="#180d04" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Fore-leg (Clawed) -->
    <path d="M 260 210 L 220 270 L 190 320 L 180 340" />
    <!-- Right Fore-leg (Clawed) -->
    <path d="M 340 210 L 380 270 L 410 320 L 420 340" />
    <!-- Mid Legs -->
    <path d="M 270 240 L 230 320 L 210 390" />
    <path d="M 330 240 L 370 320 L 390 390" />
  </g>

  <!-- GIGANTIC CORRUPTED ABDOMEN -->
  <!-- Base shape -->
  <path d="M 260 230 C 220 300, 210 390, 300 470 C 390 390, 380 300, 340 230 Z" 
        fill="url(#queenCarapace)" stroke="#090502" stroke-width="3" />

  <!-- Luminous Amber Honey Segments on Abdomen -->
  <g fill="none" stroke="url(#queenAmber)" stroke-width="14" stroke-linecap="round" filter="url(#queenAura)">
    <path d="M 252 280 Q 300 310 348 280" />
    <path d="M 246 330 Q 300 365 354 330" />
    <path d="M 255 385 Q 300 420 345 385" />
  </g>

  <!-- Royal Burgundy Mantle &amp; Ribbons -->
  <path d="M 260 180 C 240 220, 230 260, 248 300 C 265 250, 275 220, 280 200 Z" fill="url(#royalBurgundy)" />
  <path d="M 340 180 C 360 220, 370 260, 352 300 C 335 250, 325 220, 320 200 Z" fill="url(#royalBurgundy)" />

  <!-- Queen's Deadly Royal Stinger -->
  <path d="M 292 460 L 300 480 L 308 460 Z" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />

  <!-- MASSIVE ARMORED THORAX -->
  <path d="M 250 150 C 235 180, 240 220, 270 235 L 330 235 C 360 220, 365 180, 350 150 Z" 
        fill="url(#queenCarapace)" stroke="#000000" stroke-width="3" />
  <!-- Thorax Chitin Plates -->
  <path d="M 268 160 Q 300 175 332 160" stroke="#fbbf24" stroke-width="2.5" fill="none" />
  <path d="M 264 190 Q 300 210 336 190" stroke="#d97706" stroke-width="2" fill="none" />

  <!-- MAJESTIC ROYAL HEAD -->
  <ellipse cx="300" cy="130" rx="34" ry="26" fill="url(#queenCarapace)" stroke="#000000" stroke-width="2.5" />

  <!-- ORNATE HIVE CROWN CREST -->
  <g fill="url(#queenAmber)" stroke="#78350f" stroke-width="1.8" filter="url(#queenAura)">
    <polygon points="300,60 308,95 320,80 322,105 300,115 278,105 280,80 292,95" />
    <circle cx="300" cy="56" r="4.5" fill="#fef08a" />
    <circle cx="320" cy="76" r="3.5" fill="#fef08a" />
    <circle cx="280" cy="76" r="3.5" fill="#fef08a" />
  </g>

  <!-- Crown Scepter Antennae -->
  <path d="M 285 110 Q 250 75 240 50" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="239" cy="48" r="4.5" fill="#fef08a" filter="url(#queenAura)" />
  <path d="M 315 110 Q 350 75 360 50" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="361" cy="48" r="4.5" fill="#fef08a" filter="url(#queenAura)" />

  <!-- GLOWING PIERCING RUBY/AMBER COMPOUND EYES -->
  <ellipse cx="280" cy="132" rx="10" ry="14" fill="url(#rubyEyeGlow)" filter="url(#queenAura)" />
  <ellipse cx="320" cy="132" rx="10" ry="14" fill="url(#rubyEyeGlow)" filter="url(#queenAura)" />
  <!-- Eye Pupils -->
  <ellipse cx="281" cy="130" rx="3" ry="5" fill="#ffffff" />
  <ellipse cx="319" cy="130" rx="3" ry="5" fill="#ffffff" />

  <!-- Mandibles -->
  <path d="M 290 148 Q 284 165 295 168 Q 298 158 296 148" fill="#450a0a" stroke="#7f1d1d" stroke-width="1.5" />
  <path d="M 310 148 Q 316 165 305 168 Q 302 158 304 148" fill="#450a0a" stroke="#7f1d1d" stroke-width="1.5" />
</svg>
