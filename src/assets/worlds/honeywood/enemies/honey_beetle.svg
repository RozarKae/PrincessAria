<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <defs>
    <!-- Shell Gloss Gradient -->
    <linearGradient id="beetleShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Amber Vein Glow -->
    <linearGradient id="amberVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Horn Gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Filter for Honey Glow -->
    <filter id="honeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Heavy Armored Legs -->
  <g stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Back Leg -->
    <path d="M 30 55 L 20 70 L 12 78" />
    <!-- Middle Leg -->
    <path d="M 55 58 L 52 72 L 46 80" />
    <!-- Front Leg -->
    <path d="M 85 58 L 92 72 L 102 78" />
  </g>

  <!-- Soft Exposed Abdomen (Visible at rear bottom - weakness!) -->
  <ellipse cx="32" cy="52" rx="18" ry="14" fill="#92400e" stroke="#d97706" stroke-width="1.5" />
  <circle cx="28" cy="53" r="3" fill="#f59e0b" filter="url(#honeyGlow)" opacity="0.8" />
  <circle cx="36" cy="54" r="2.5" fill="#fef08a" filter="url(#honeyGlow)" opacity="0.7" />

  <!-- Massive Glossy Armored Elytra (Carapace Shell) -->
  <path d="M 22 52 C 20 28, 50 16, 78 24 C 82 42, 78 58, 68 62 C 45 66, 26 62, 22 52 Z" 
        fill="url(#beetleShell)" stroke="#090d16" stroke-width="2.5" />

  <!-- Carapace Highlight Rim -->
  <path d="M 26 44 C 30 25, 52 20, 72 26" fill="none" stroke="#64748b" stroke-width="2" opacity="0.8" />

  <!-- Amber Honey Cracks / Veins on Shell -->
  <g stroke="url(#amberVein)" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#honeyGlow)">
    <path d="M 38 42 Q 46 36 54 44 T 66 38" />
    <path d="M 44 48 L 50 56" />
    <path d="M 58 32 L 64 26" />
  </g>

  <!-- Heavy Armored Head / Pronotum -->
  <path d="M 72 28 C 82 26, 96 34, 98 48 C 96 58, 82 62, 72 60 Z" 
        fill="#0f172a" stroke="#020617" stroke-width="2" />

  <!-- Massive Golden Horn (Armored front) -->
  <path d="M 94 40 C 104 38, 116 28, 118 16 C 112 24, 104 30, 96 34 Z" 
        fill="url(#hornGrad)" stroke="#78350f" stroke-width="1.5" filter="url(#honeyGlow)" />
  <path d="M 92 46 C 102 48, 110 52, 114 58 C 108 55, 98 52, 92 50 Z" 
        fill="url(#hornGrad)" stroke="#78350f" stroke-width="1.2" />

  <!-- Corrupted Glowing Eye -->
  <ellipse cx="88" cy="42" rx="4" ry="5" fill="#ef4444" />
  <ellipse cx="89" cy="41" rx="1.5" ry="2" fill="#fef08a" />
</svg>
