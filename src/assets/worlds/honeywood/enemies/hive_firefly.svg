<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <!-- Firefly Lantern Radiant Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0)" />
    </radialGradient>

    <!-- Translucent Gossamer Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.75)" />
      <stop offset="60%" stop-color="rgba(245, 158, 11, 0.35)" />
      <stop offset="100%" stop-color="rgba(180, 83, 9, 0.15)" />
    </linearGradient>

    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Abdomen Lantern Halo -->
  <circle cx="30" cy="56" r="24" fill="url(#lanternGlow)" opacity="0.85" filter="url(#bloom)" />

  <!-- Gossamer Rapid Wings (Top) -->
  <g fill="url(#wingGrad)" stroke="#fef08a" stroke-width="1.2">
    <!-- Wing 1 -->
    <path d="M 46 36 C 42 16, 62 8, 74 14 C 70 26, 56 34, 46 36 Z" />
    <!-- Wing 2 -->
    <path d="M 40 38 C 28 18, 12 14, 18 26 C 24 34, 34 38, 40 38 Z" />
  </g>

  <!-- Slender Insect Legs -->
  <g stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 44 48 L 40 62 L 36 70" />
    <path d="M 52 48 L 54 62 L 60 70" />
  </g>

  <!-- Glowing Honey Lantern Abdomen -->
  <ellipse cx="30" cy="56" rx="14" ry="11" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" />
  <ellipse cx="29" cy="54" rx="10" ry="7" fill="#fef08a" />

  <!-- Dark Armored Thorax -->
  <ellipse cx="48" cy="42" rx="9" ry="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Head &amp; Antennae -->
  <circle cx="58" cy="40" r="7" fill="#020617" />
  <!-- Feathered Antennae -->
  <path d="M 62 36 Q 72 26 78 28" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 64 38 Q 74 34 82 38" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Corrupted Emerald/Amber Eye -->
  <circle cx="61" cy="38" r="3.2" fill="#ef4444" />
  <circle cx="62" cy="37" r="1.2" fill="#ffffff" />
</svg>
